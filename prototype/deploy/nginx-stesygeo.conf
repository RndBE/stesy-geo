# Prototipe STESY GEO (situs statis) — /etc/nginx/sites-available/stesygeo
#   sudo ln -s /etc/nginx/sites-available/stesygeo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   HTTPS: sudo certbot --nginx -d stesygeo.domain-anda.id
server {
    listen 80;
    server_name stesygeo.domain-anda.id;   # ganti; atau _ untuk akses lewat IP VPS

    root /var/www/stesygeo;                # isi dist/ diekstrak ke sini
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css text/html text/csv image/svg+xml;
    gzip_min_length 1024;

    # aset ber-hash boleh di-cache lama
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /data/   { expires 1h; }

    # SPA: semua rute (/twin, /zona/3, …) diarahkan ke index.html
    location / { try_files $uri $uri/ /index.html; }
}
